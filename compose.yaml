services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: lilerp
      POSTGRES_PASSWORD: lilerp_local
      POSTGRES_DB: lilerp
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lilerp -d lilerp"]
      interval: 2s
      timeout: 5s
      retries: 30
volumes:
  postgres_data:

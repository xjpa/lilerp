name: Checks
on: [push, pull_request]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: lilerp
          POSTGRES_PASSWORD: lilerp_local
          POSTGRES_DB: lilerp
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lilerp -d lilerp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://lilerp:lilerp_local@127.0.0.1:5432/lilerp?schema=public
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:migrate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:integration
      - run: npm run db:seed
      - run: npm run build
